<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<title>Graf 5b — Průměrné platy státních úředníků</title>
<style>
  :root {
    --c-orange: #e8a838;
    --c-blue:   #1d3a5e;
    --c-green:  #2a8b47;
    --c-title:  #2563c8;
    --c-axis:   #2a2a2a;
    --c-grid:   #d8d8d8;
    --c-grid-v: #e6e6e6;
    --c-bg:     #ffffff;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #f4f4f1;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame {
    background: var(--c-bg);
    padding: 28px 36px 24px 24px;
    box-shadow: 0 2px 30px rgba(0,0,0,0.06);
    border-radius: 4px;
    max-width: 1280px;
    width: 100%;
  }
  svg.chart {
    display: block;
    width: 100%;
    height: auto;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  .title-text { font-size: 24px; font-weight: 700; fill: var(--c-title); }
  .axis-label { font-size: 16px; font-weight: 700; fill: #1a1a1a; }
  .tick-label { font-size: 14px; fill: #1a1a1a; }
  .tick-label.current { font-weight: 700; }

  .gridline   { stroke: var(--c-grid);   stroke-width: 1; }
  .gridline-v { stroke: var(--c-grid-v); stroke-width: 1; }
  .axis-line  { stroke: #1a1a1a; stroke-width: 1.2; }
  .baseline-100 { stroke: #1a1a1a; stroke-width: 1.6; }

  .series-line {
    fill: none;
    stroke-width: 3;
    stroke-linejoin: round;
    stroke-linecap: round;
    transition: opacity .2s, stroke-width .2s;
  }
  .series-dot { stroke: #fff; stroke-width: 1.6; transition: r .15s, opacity .2s; }

  .chart[data-hover="ministerstva"] .series--ostatni,
  .chart[data-hover="ministerstva"] .series--neustredni,
  .chart[data-hover="ostatni"]      .series--ministerstva,
  .chart[data-hover="ostatni"]      .series--neustredni,
  .chart[data-hover="neustredni"]   .series--ministerstva,
  .chart[data-hover="neustredni"]   .series--ostatni { opacity: .25; }

  .chart[data-hover="ministerstva"] .series--ministerstva .series-line,
  .chart[data-hover="ostatni"]      .series--ostatni      .series-line,
  .chart[data-hover="neustredni"]   .series--neustredni   .series-line { stroke-width: 4; }

  .hit-line { fill: none; stroke: transparent; stroke-width: 22; cursor: pointer; }

  /* leader (dotted) */
  .tip-leader {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 1 5;
    opacity: 0.85;
  }
  .tip-anchor { stroke: #fff; stroke-width: 2; }

  /* tooltip cards (now stacked on right of chart) */
  .tip-bg { filter: drop-shadow(0 4px 10px rgba(0,0,0,0.18)); }
  .tip-title { font-size: 16px; font-weight: 700; fill: #ffffff; letter-spacing: 0.005em; }
  .tip-row { font-size: 14px; fill: #ffffff; font-weight: 400; }
  .tip-row.bold { font-weight: 600; }
  .tip-divider { stroke: rgba(255,255,255,0.4); stroke-width: 1; }

  .hover-bubble { pointer-events: none; opacity: 0; transition: opacity .12s; }
  .hover-bubble.show { opacity: 1; }
  .hover-bubble rect { fill: #fff; stroke: #1a1a1a; stroke-width: 1; }
  .hover-bubble text { font-size: 12px; font-weight: 600; fill: #1a1a1a; }

  /* notes block sits flush under the chart (no top border — bunched with plot) */
  .notes-block {
    text-align: left;
    font-size: 11px;
    line-height: 1.5;
    color: #2a2a2a;
    padding: 8px 8px 4px 24px;
    max-width: 1000px;
  }
  .notes-block p { margin: 0 0 3px 0; position: relative; }
  .notes-block .asterisk {
    position: absolute;
    left: -10px;
    top: 0;
    color: #2a2a2a;
  }

  /* footer below the thin line: logo bottom-left, info-box bottom-right */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    margin-top: 12px;
    padding: 16px 8px 4px 24px;
    border-top: 1px solid #e8e8e8;
  }
  .footer-logo { height: 64px; width: auto; display: block; }

  /* grey rounded info card: teaser top, QR + URL row below */
  .info-box {
    background: #f1f1ee;
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 420px;
  }
  .info-teaser {
    font-size: 12.5px;
    color: #1a1a1a;
    line-height: 1.4;
  }
  .info-teaser strong { font-weight: 700; }
  .info-qr-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .info-qr {
    width: 64px;
    height: 64px;
    background: #fff;
    padding: 3px;
    border: 1px solid #e0e0e0;
    flex-shrink: 0;
  }
  .info-qr svg { width: 100%; height: 100%; display: block; }
  .info-url {
    font-size: 12.5px;
    color: #444;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="frame">
    <!-- viewBox 1280×720. Plot at (110, 80) is 780 wide × 540 tall.
         Tooltip column sits to the right at x=920..1210 (290 wide). -->
    <svg class="chart" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" aria-label="Graf 5b">
      <!-- Title -->
      <text class="title-text" x="500" y="36" text-anchor="middle">
        Průměrné platy státních úředníků v poměru k průměrné mzdě v ekonomice
      </text>

      <!-- Y-axis title -->
      <g transform="translate(28, 350) rotate(-90)">
        <text class="axis-label" text-anchor="middle">Poměr platů státních úředníku a prům. mzdy</text>
      </g>

      <!-- ============ PLOT GROUP ============ -->
      <g id="plot" transform="translate(110, 80)">

        <!-- vertical gridlines, every year (step 65px) -->
        <g>
          <line class="gridline-v" x1="0"   y1="0" x2="0"   y2="540"/>
          <line class="gridline-v" x1="65"  y1="0" x2="65"  y2="540"/>
          <line class="gridline-v" x1="130" y1="0" x2="130" y2="540"/>
          <line class="gridline-v" x1="195" y1="0" x2="195" y2="540"/>
          <line class="gridline-v" x1="260" y1="0" x2="260" y2="540"/>
          <line class="gridline-v" x1="325" y1="0" x2="325" y2="540"/>
          <line class="gridline-v" x1="390" y1="0" x2="390" y2="540"/>
          <line class="gridline-v" x1="455" y1="0" x2="455" y2="540"/>
          <line class="gridline-v" x1="520" y1="0" x2="520" y2="540"/>
          <line class="gridline-v" x1="585" y1="0" x2="585" y2="540"/>
          <line class="gridline-v" x1="650" y1="0" x2="650" y2="540"/>
          <line class="gridline-v" x1="715" y1="0" x2="715" y2="540"/>
          <line class="gridline-v" x1="780" y1="0" x2="780" y2="540"/>
        </g>

        <!-- horizontal gridlines at 85,90,95,105,110,115 -->
        <line class="gridline" x1="0" y1="16.36" x2="780" y2="16.36"/>
        <line class="gridline" x1="0" y1="98.18" x2="780" y2="98.18"/>
        <line class="gridline" x1="0" y1="180.0" x2="780" y2="180.0"/>
        <line class="gridline" x1="0" y1="343.6" x2="780" y2="343.6"/>
        <line class="gridline" x1="0" y1="425.5" x2="780" y2="425.5"/>
        <line class="gridline" x1="0" y1="507.3" x2="780" y2="507.3"/>

        <!-- baseline 100% -->
        <line class="baseline-100" x1="0" y1="261.8" x2="780" y2="261.8"/>

        <!-- Y tick labels -->
        <g>
          <text class="tick-label" x="-12" y="16.36"  text-anchor="end" dominant-baseline="middle">115 %</text>
          <text class="tick-label" x="-12" y="98.18"  text-anchor="end" dominant-baseline="middle">110 %</text>
          <text class="tick-label" x="-12" y="180.0"  text-anchor="end" dominant-baseline="middle">105 %</text>
          <text class="tick-label" x="-12" y="261.8"  text-anchor="end" dominant-baseline="middle">100 %</text>
          <text class="tick-label" x="-12" y="343.6"  text-anchor="end" dominant-baseline="middle">95 %</text>
          <text class="tick-label" x="-12" y="425.5"  text-anchor="end" dominant-baseline="middle">90 %</text>
          <text class="tick-label" x="-12" y="507.3"  text-anchor="end" dominant-baseline="middle">85 %</text>
        </g>

        <!-- X tick labels every year (2025 bold) -->
        <g>
          <text class="tick-label" x="0"   y="562" text-anchor="middle">2013</text>
          <text class="tick-label" x="65"  y="562" text-anchor="middle">2014</text>
          <text class="tick-label" x="130" y="562" text-anchor="middle">2015</text>
          <text class="tick-label" x="195" y="562" text-anchor="middle">2016</text>
          <text class="tick-label" x="260" y="562" text-anchor="middle">2017</text>
          <text class="tick-label" x="325" y="562" text-anchor="middle">2018</text>
          <text class="tick-label" x="390" y="562" text-anchor="middle">2019</text>
          <text class="tick-label" x="455" y="562" text-anchor="middle">2020</text>
          <text class="tick-label" x="520" y="562" text-anchor="middle">2021</text>
          <text class="tick-label" x="585" y="562" text-anchor="middle">2022</text>
          <text class="tick-label" x="650" y="562" text-anchor="middle">2023</text>
          <text class="tick-label" x="715" y="562" text-anchor="middle">2024</text>
          <text class="tick-label current" x="780" y="562" text-anchor="middle">2025</text>
        </g>

        <!-- axis bottom -->
        <line class="axis-line" x1="0" y1="540" x2="780" y2="540"/>

        <!-- ====== Neústřední (green) ====== -->
        <g class="series series--neustredni" data-key="neustredni">
          <polyline class="series-line" stroke="var(--c-green)"
            points="0,363.3 65,343.7 130,322.5 195,258.7 260,226.0 325,250.2 390,278.0 455,276.4 520,360.4 585,417.0 650,405.6 715,461.2 780,472.7"/>
          <g fill="var(--c-green)">
            <circle class="series-dot" cx="0" cy="363.3" r="5"/>
            <circle class="series-dot" cx="65" cy="343.7" r="5"/>
            <circle class="series-dot" cx="130" cy="322.5" r="5"/>
            <circle class="series-dot" cx="195" cy="258.7" r="5"/>
            <circle class="series-dot" cx="260" cy="226.0" r="5"/>
            <circle class="series-dot" cx="325" cy="250.2" r="5"/>
            <circle class="series-dot" cx="390" cy="278.0" r="5"/>
            <circle class="series-dot" cx="455" cy="276.4" r="5"/>
            <circle class="series-dot" cx="520" cy="360.4" r="5"/>
            <circle class="series-dot" cx="585" cy="417.0" r="5"/>
            <circle class="series-dot" cx="650" cy="405.6" r="5"/>
            <circle class="series-dot" cx="715" cy="461.2" r="5"/>
            <circle class="series-dot" cx="780" cy="472.7" r="5"/>
          </g>
          <polyline class="hit-line"
            points="0,363.3 65,343.7 130,322.5 195,258.7 260,226.0 325,250.2 390,278.0 455,276.4 520,360.4 585,417.0 650,405.6 715,461.2 780,472.7"
            data-series="neustredni"/>
        </g>

        <!-- ====== Ostatní (blue) ====== -->
        <g class="series series--ostatni" data-key="ostatni">
          <polyline class="series-line" stroke="var(--c-blue)"
            points="0,391.0 65,359.9 130,351.7 195,301.1 260,266.7 325,212.7 390,310.2 455,298.7 520,375.7 585,430.3 650,441.7 715,512.0 780,495.6"/>
          <g fill="var(--c-blue)">
            <circle class="series-dot" cx="0" cy="391.0" r="5"/>
            <circle class="series-dot" cx="65" cy="359.9" r="5"/>
            <circle class="series-dot" cx="130" cy="351.7" r="5"/>
            <circle class="series-dot" cx="195" cy="301.1" r="5"/>
            <circle class="series-dot" cx="260" cy="266.7" r="5"/>
            <circle class="series-dot" cx="325" cy="212.7" r="5"/>
            <circle class="series-dot" cx="390" cy="310.2" r="5"/>
            <circle class="series-dot" cx="455" cy="298.7" r="5"/>
            <circle class="series-dot" cx="520" cy="375.7" r="5"/>
            <circle class="series-dot" cx="585" cy="430.3" r="5"/>
            <circle class="series-dot" cx="650" cy="441.7" r="5"/>
            <circle class="series-dot" cx="715" cy="512.0" r="5"/>
            <circle class="series-dot" cx="780" cy="495.6" r="5"/>
          </g>
          <polyline class="hit-line"
            points="0,391.0 65,359.9 130,351.7 195,301.1 260,266.7 325,212.7 390,310.2 455,298.7 520,375.7 585,430.3 650,441.7 715,512.0 780,495.6"
            data-series="ostatni"/>
        </g>

        <!-- ====== Ministerstva (orange) ====== -->
        <g class="series series--ministerstva" data-key="ministerstva">
          <polyline class="series-line" stroke="var(--c-orange)"
            points="0,248.3 65,197.6 130,168.2 195,103.6 260,44.7 325,16.4 390,81.8 455,103.6 520,185.4 585,242.2 650,240.5 715,341.2 780,346.1"/>
          <g fill="var(--c-orange)">
            <circle class="series-dot" cx="0" cy="248.3" r="5"/>
            <circle class="series-dot" cx="65" cy="197.6" r="5"/>
            <circle class="series-dot" cx="130" cy="168.2" r="5"/>
            <circle class="series-dot" cx="195" cy="103.6" r="5"/>
            <circle class="series-dot" cx="260" cy="44.7" r="5"/>
            <circle class="series-dot" cx="325" cy="16.4" r="5"/>
            <circle class="series-dot" cx="390" cy="81.8" r="5"/>
            <circle class="series-dot" cx="455" cy="103.6" r="5"/>
            <circle class="series-dot" cx="520" cy="185.4" r="5"/>
            <circle class="series-dot" cx="585" cy="242.2" r="5"/>
            <circle class="series-dot" cx="650" cy="240.5" r="5"/>
            <circle class="series-dot" cx="715" cy="341.2" r="5"/>
            <circle class="series-dot" cx="780" cy="346.1" r="5"/>
          </g>
          <polyline class="hit-line"
            points="0,248.3 65,197.6 130,168.2 195,103.6 260,44.7 325,16.4 390,81.8 455,103.6 520,185.4 585,242.2 650,240.5 715,341.2 780,346.1"
            data-series="ministerstva"/>
        </g>

        <!-- hover value bubble -->
        <g class="hover-bubble" id="hoverBubble">
          <rect x="-32" y="-30" width="64" height="22" rx="4"/>
          <text x="0" y="-15" text-anchor="middle">0 %</text>
        </g>
      </g>

      <!-- X-axis title (centered under plot) -->
      <text class="axis-label" x="500" y="682" text-anchor="middle">Rok</text>

      <!-- ============ TOOLTIP STACK (outside plot, in svg coords) ============
           Plot ends at svg x=890. Each line's 2025 endpoint sits at:
             Ministerstva: (890, 426.83)
             Neústřední:   (890, 552.81)
             Ostatní:      (890, 575.71)
           Tooltips are stacked vertically at x=920, each 290 wide, ~95 tall.
           Tooltip vertical centers roughly track the 2025 ordering;
           a dotted leader runs from the tooltip's left-middle to its endpoint. -->

      <!-- Min: tooltip center y=320.5; leader → (890, 426.83) -->
      <g>
        <path class="tip-leader" stroke="var(--c-orange)"
              d="M 920 320.5 L 890 426.83"/>
        <circle class="tip-anchor" cx="890" cy="426.83" r="4.5" fill="var(--c-orange)"/>
      </g>
      <g class="tip" data-tip="ministerstva" transform="translate(920, 266.5)">
        <rect class="tip-bg" x="0" y="0" width="290" height="108" rx="10" ry="10" fill="var(--c-orange)"/>
        <text class="tip-title" x="14" y="26">Ministerstva</text>
        <line class="tip-divider" x1="14" y1="38" x2="276" y2="38"/>
        <text class="tip-row bold" x="14" y="58">23,1 tis. zam.</text>
        <text class="tip-row" x="14" y="76">Ø plat <tspan font-weight="600">62 300 Kč/měsíc</tspan></text>
        <text class="tip-row" x="14" y="94">5 % pod platovou úrovní Prahy</text>
      </g>

      <!-- Neú: tooltip center y=440.5; leader → (890, 552.81) -->
      <g>
        <path class="tip-leader" stroke="var(--c-green)"
              d="M 920 440.5 L 890 552.81"/>
        <circle class="tip-anchor" cx="890" cy="552.81" r="4.5" fill="var(--c-green)"/>
      </g>
      <g class="tip" data-tip="neustredni" transform="translate(920, 386.5)">
        <rect class="tip-bg" x="0" y="0" width="290" height="108" rx="10" ry="10" fill="var(--c-green)"/>
        <text class="tip-title" x="14" y="26">Neústřední státní správa</text>
        <line class="tip-divider" x1="14" y1="38" x2="276" y2="38"/>
        <text class="tip-row bold" x="14" y="58">47,0 tis. zaměstnanců</text>
        <text class="tip-row" x="14" y="76">Ø plat <tspan font-weight="600">45 500 Kč/měsíc</tspan></text>
        <text class="tip-row" x="14" y="94">13 % pod platovou úrovní ČR</text>
      </g>

      <!-- Ost: tooltip center y=560.5; leader → (890, 575.71) -->
      <g>
        <path class="tip-leader" stroke="var(--c-blue)"
              d="M 920 560.5 L 890 575.71"/>
        <circle class="tip-anchor" cx="890" cy="575.71" r="4.5" fill="var(--c-blue)"/>
      </g>
      <g class="tip" data-tip="ostatni" transform="translate(920, 506.5)">
        <rect class="tip-bg" x="0" y="0" width="290" height="108" rx="10" ry="10" fill="var(--c-blue)"/>
        <text class="tip-title" x="14" y="26">Ostatní ústřední úřady</text>
        <line class="tip-divider" x1="14" y1="38" x2="276" y2="38"/>
        <text class="tip-row bold" x="14" y="58">4,4 tis. zam.</text>
        <text class="tip-row" x="14" y="76">Ø plat <tspan font-weight="600">56 400 Kč/měsíc</tspan></text>
        <text class="tip-row" x="14" y="94">14 % pod platovou úrovní Prahy</text>
      </g>
    </svg>

    <!-- notes block bunched with the chart (above the thin separator) -->
    <div class="notes-block">
      <p><span class="asterisk">*</span>Ministerstva a ústřední orgány srovnáváme s platovou úrovní Prahy, ostatní s celou ČR.</p>
      <p>Ministerstva zahrnují cca 10 tis. pracovníků bezpečnostních sborů v kapitole MV.</p>
    </div>

<script>
  (function () {
    try {
      var qr = qrcode(0, 'M');
      qr.addData('https://ideaapps.cerge-ei.cz/zamestnancistatu/');
      qr.make();
      var svg = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      var holder = document.getElementById('qrcode');
      if (holder) holder.innerHTML = svg;
    } catch (e) { console.warn('QR generation failed', e); }
  })();

  (function () {
    const svg = document.querySelector('svg.chart');
    const hits = svg.querySelectorAll('.hit-line');
    const bubble = document.getElementById('hoverBubble');
    const bubbleText = bubble.querySelector('text');

    const series = {
      ministerstva: { vals: [100.8,103.9,105.7,109.7,113.3,115.0,111.0,109.7,104.7,101.2,101.3,95.1,94.8] },
      ostatni:      { vals: [92.1,94.0,94.5,97.6,99.7,103.0,97.1,97.8,93.1,89.7,89.0,84.7,85.7] },
      neustredni:   { vals: [93.8,95.0,96.3,100.2,102.2,100.7,99.0,99.1,94.0,90.5,91.2,87.8,87.1] }
    };

    function yPx(v) { return (116 - v) * (540/33); }
    const X_STEP = 65;

    hits.forEach(hit => {
      const key = hit.dataset.series;
      hit.addEventListener('mouseenter', () => { svg.dataset.hover = key; });
      hit.addEventListener('mouseleave', () => {
        delete svg.dataset.hover;
        bubble.classList.remove('show');
      });
      hit.addEventListener('mousemove', (e) => {
        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const plotEl = svg.querySelector('#plot');
        const ctm = plotEl.getScreenCTM().inverse();
        const local = pt.matrixTransform(ctm);
        const idx = Math.max(0, Math.min(12, Math.round(local.x / X_STEP)));
        const val = series[key].vals[idx];
        bubble.setAttribute('transform', `translate(${idx * X_STEP}, ${yPx(val)})`);
        bubbleText.textContent = (val.toFixed(1).replace('.', ',')) + ' %';
        bubble.classList.add('show');
      });
    });
  })();
</script>
